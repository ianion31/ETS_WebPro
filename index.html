<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem CRUD Mahasiswa & Jalur Masuk</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Panel Admin Akademik</h2>
    <a href="auth.html" class="btn btn-danger btn-sm">Logout</a>
</div>

    <!-- Navigasi Tabs -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="jalur-tab" data-bs-toggle="tab" data-bs-target="#jalur" type="button" role="tab">Data Jalur Masuk</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="mahasiswa-tab" data-bs-toggle="tab" data-bs-target="#mahasiswa" type="button" role="tab">Data Mahasiswa</button>
        </li>
    </ul>

    <div class="tab-content bg-white p-4 border border-top-0 rounded-bottom" id="myTabContent">
        
        <!-- ================= BAGIAN JALUR MASUK ================= -->
        <div class="tab-pane fade show active" id="jalur" role="tabpanel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Daftar Jalur Masuk</h4>
                <button class="btn btn-primary" onclick="openModalJalur()">+ Tambah Jalur Masuk</button>
            </div>
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nama Jalur Seleksi</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-jalur-body">
                    <!-- Data di-render lewat JS -->
                </tbody>
            </table>
        </div>

        <!-- ================= BAGIAN MAHASISWA ================= -->
        <div class="tab-pane fade" id="mahasiswa" role="tabpanel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Daftar Mahasiswa</h4>
                <button class="btn btn-primary" onclick="openModalMahasiswa()">+ Tambah Mahasiswa</button>
            </div>
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>NRP</th>
                        <th>Nama Mahasiswa</th>
                        <th>Angkatan</th>
                        <th>Jalur Masuk</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-mahasiswa-body">
                    <!-- Data di-render lewat JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ================= MODAL FORM JALUR MASUK ================= -->
<div class="modal fade" id="modalJalur" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="form-jalur" onsubmit="handleSaveJalur(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalJalurTitle">Tambah Jalur Masuk</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="jalur-id">
                    <div class="mb-3">
                        <label class="form-label">Nama Jalur Seleksi</label>
                        <input type="text" class="form-control" id="nama_jalur" required placeholder="Contoh: SNBP, SNBT, Mandiri">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-success">Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ================= MODAL FORM MAHASISWA ================= -->
<div class="modal fade" id="modalMahasiswa" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="form-mahasiswa" onsubmit="handleSaveMahasiswa(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalMahasiswaTitle">Tambah Mahasiswa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="mahasiswa-old-nrp"> <!-- Untuk kebutuhan edit -->
                    <div class="mb-3">
                        <label class="form-label">NRP</label>
                        <input type="text" class="form-control" id="mhs-nrp" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nama Mahasiswa</label>
                        <input type="text" class="form-control" id="mhs-nama" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Angkatan</label>
                        <input type="number" class="form-control" id="mhs-angkatan" required placeholder="Contoh: 2025">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jalur Masuk</label>
                        <select class="form-select" id="mhs-jalur-id" required>
                            <option value="">Pilih Jalur Masuk...</option>
                            <!-- Pilihan di-render lewat JS -->
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-success">Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="app.js"></script>
</body>
</html>
